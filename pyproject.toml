[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout"]
# 版本为作者选取的当前稳定版，本仓库内未经测试（适配器仅为接口示例）
real = [
    "onnxruntime==1.20.1",
    "numpy==2.1.3",
    "httpx==0.28.1",
    "transformers==4.47.1",  # Smart Turn 的 Whisper 特征提取
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
timeout = 30
testpaths = ["tests"]
